# 2 about
about_text_1: "I am a music producer from Münster and studied keyboard and music production at the Münster University of Music for four years. For me, music production combines creativity, emotion, and technical inventiveness in a unique way – the perfect mix for me."
about_text_2: "I help artists develop their ideas into finished songs. I cover the entire process: from pre-production, songwriting, arrangement, and production to recording vocals, mixing, and mastering. Whether you already have finished ideas or are just starting out, I adapt to your needs and ensure your music sounds exactly as you envision it."
about_text_3: "I take care of the production and all technical aspects so you can focus on your music. At the same time, I support you creatively and help you bring your song to completion."
