<div class="wrapper">
  <section class="getstarted-section" style="padding: 5rem 0; text-align: center;">
    <div class="container">
      <div class="tally-wrapper">
        <iframe
          data-tally-src="https://tally.so/embed/wgRo5O?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1"
          loading="lazy"
          title="Project Planner">
        </iframe>
      </div>
    </div>
  </section>
</div>

<script>
  var d=document,w="https://tally.so/widgets/embed.js",v=function(){
    if(typeof Tally!=="undefined")Tally.loadEmbeds();
    else d.querySelectorAll("iframe[data-tally-src]:not([src])").forEach(function(e){e.src=e.dataset.tallySrc});
  };
  if(typeof Tally!=="undefined")v();
  else if(d.querySelector('script[src="'+w+'"]')==null){
    var s=d.createElement("script");
    s.src=w; s.onload=v; s.onerror=v; d.body.appendChild(s);
  }
</script>
