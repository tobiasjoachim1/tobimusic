<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ===== Fonts ===== -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- ===== Libre Franklin ===== -->
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <!-- ===== Noto Sans Simplified Chinese ===== -->
  <!-- <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@100..900&display=swap" rel="stylesheet"> -->
  <!-- ===== Bitter ===== -->
  <link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <!-- ===== Bootstrap CSS ===== -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

  <!-- ===== Bootstrap Icons ===== -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">


  <!-- ===== Custom CSS ===== -->
  {{ $custom := resources.Get "css/custom.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $custom.RelPermalink }}">

  <!-- ===== Scripts ===== -->
  <script src="https://code.jquery.com/jquery-2.1.1.min.js" type="text/javascript"></script>
  <script src="/js/bootstrap.js" type="text/javascript"></script>
  <script src="/js/jquery.jplayer.min.js" type="text/javascript"></script>
  <script src="/js/waypoints.min.js" type="text/javascript"></script>
  <script src="/js/jquery.stellar.min.js" type="text/javascript"></script>
  <script src="/js/stage.js" type="text/javascript"></script>

  {{ with .Site.Params.fonts }}
    <link href='https://fonts.googleapis.com/css?family={{ . }}' rel='stylesheet' type='text/css'>
  {{ end }}

  {{ if (and .IsPage (eq .Type "song")) }}
    <script src="/js/jquery.leadsheet.js" type="text/javascript"></script>
    <script type="text/javascript">
      $(document).ready(function() {
        var leadSheet = new LeadSheet();
        $(".leadsheet-lyrics").each(function() {
          var lyrics = $(this).text().trim();
          leadSheet.parse(lyrics);
          $(this).html(leadSheet.emit());
        });
      });
    </script>
  {{ end }}
</head>
